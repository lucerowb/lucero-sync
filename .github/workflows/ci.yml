name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tests build the host's native assets (the tray plugin needs GTK, X11, Xi).
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, os: ubuntu-latest, cmd: flutter build apk --debug }
          - { target: linux, os: ubuntu-latest, cmd: flutter build linux --debug }
          - { target: windows, os: windows-latest, cmd: flutter build windows --debug }
          - { target: macos, os: macos-latest, cmd: flutter build macos --debug }
          - { target: ios, os: macos-latest, cmd: flutter build ios --debug --no-codesign }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.cmd }}
