name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk lucero-sync.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: lucero-sync.apk

  apple:
    name: iOS IPA + macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - run: flutter build ios --release --no-codesign
      - name: Package IPA (for AltStore / SideStore)
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr lucero-sync-unsigned.ipa Payload
      - name: Generate AltStore / SideStore source
        run: >
          python3 .github/scripts/altstore_source.py
          build/ios/iphoneos/Runner.app/Info.plist lucero-sync-unsigned.ipa
          "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" altstore-source.json

      - run: flutter build macos --release
      - name: Package macOS app
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/Lucero Sync.app" lucero-sync-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            lucero-sync-unsigned.ipa
            altstore-source.json
            lucero-sync-macos.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath lucero-sync-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: lucero-sync-windows-x64.zip

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: |
          B=build/linux/x64/release/bundle
          cp packaging/linux/lucero-sync.desktop packaging/linux/lucero-sync.png packaging/linux/install.sh "$B"/
          tar -czf lucero-sync-linux-x64.tar.gz -C "$B" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: lucero-sync-linux-x64.tar.gz

  publish:
    name: Publish GitHub release
    needs: [android, apple, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lucero-sync.apk
            lucero-sync-unsigned.ipa
            altstore-source.json
            lucero-sync-macos.zip
            lucero-sync-windows-x64.zip
            lucero-sync-linux-x64.tar.gz
