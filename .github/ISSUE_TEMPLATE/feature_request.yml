name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This doesn't require a cloud service, account, or sending data off the local network.
          required: true
